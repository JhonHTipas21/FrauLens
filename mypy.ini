[mypy]
ignore_missing_imports = True
explicit_package_bases = True
disable_error_code = import-untyped
exclude = (?x)(
    ^venv/
    | ^\.venv/
    | ^build/
    | ^dist/
  )

[mypy-requests.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-shap.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

