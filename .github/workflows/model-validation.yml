name: MLOps Model Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/train.py'
      - 'src/classifier.py'
      - 'src/anomaly_detector.py'
      - 'src/data_loader.py'
      - 'src/utils.py'
      - 'scripts/ci_validate.py'

jobs:
  validate-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install System Dependencies (libomp for XGBoost)
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain FraudLens Pipeline
        run: |
          python src/train.py
          
      - name: Run MLOps Model Validation
        env:
          MIN_AUC_PR: 0.70
          MIN_F1: 0.65
          MIN_RECALL: 0.60
        run: |
          python scripts/ci_validate.py

      - name: Upload Model and Model Card as Workflow Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fraudlens-model-${{ github.run_id }}
          path: |
            models/fraud_model.joblib
            models/model_card_*.md
            models/metadata.json

      - name: Create GitHub Release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-v${{ github.run_id }}
          name: Model Release - v${{ github.run_id }}
          body: |
            Automated MLOps release containing validated FraudLens model artifacts.
            Model passed all validation thresholds.
          files: |
            models/fraud_model.joblib
            models/model_card_*.md
            models/metadata.json
